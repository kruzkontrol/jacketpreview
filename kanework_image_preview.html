<!-- =====================================================================
     Kanework - "See your image on the jacket back" widget.

     Fully self-contained: it runs entirely in the customer's browser.
     They pick their image file, it is drawn onto a jacket-back photo so
     they can check it looks right BEFORE they upload it to the order.

     This does NOT read Ecwid's file-upload option (a browser cannot),
     and it does NOT talk to the shop PC. It is a self-check only - the
     shop still builds the real proof in the Studio.

     TO USE: host this file and the jacket-back image on GitHub Pages
     (order.kanework.com), then embed it on the line-jacket product with:

       <iframe src="https://order.kanework.com/kanework_image_preview.html"
               style="width:100%;height:640px;border:0"
               loading="lazy"></iframe>

     Change JACKET_BACK_URL below if the back photo is named differently.
====================================================================== -->
<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>See your image on the back</title>
<style>
  body{margin:0;padding:12px;font:15px system-ui,Segoe UI,sans-serif;
       background:#fff;color:#222;text-align:center}
  h3{margin:0 0 4px;font-size:16px}
  p.sub{margin:0 0 12px;font-size:13px;color:#666}
  .pick{display:inline-block;padding:10px 16px;border-radius:8px;
        background:#3a4252;color:#fff;cursor:pointer;font-size:14px}
  .pick:hover{background:#4a5566}
  input[type=file]{display:none}
  .stage{position:relative;display:inline-block;margin-top:14px;
         max-width:100%}
  .stage img.jacket{max-width:100%;display:block;border-radius:8px}
  canvas{position:absolute;left:0;top:0;pointer-events:none}
  .controls{margin-top:12px;font-size:13px;color:#555}
  .controls label{display:inline-block;margin:0 8px}
  input[type=range]{vertical-align:middle}
  .note{margin-top:10px;font-size:12px;color:#888;line-height:1.5}
  .warn{color:#b26a00}
</style></head><body>

<h3>See your image on the jacket back</h3>
<p class="sub">Pick your image to check how it looks. This is a preview
only &ndash; upload the same file on the order below.</p>

<label class="pick">Choose your image
  <input type="file" id="file" accept="image/*">
</label>

<div class="stage" id="stage">
  <img class="jacket" id="jacket" alt="Jacket back">
  <canvas id="canvas"></canvas>
</div>

<div class="controls" id="controls" style="display:none">
  <label>Size
    <input type="range" id="size" min="30" max="100" value="62">
  </label>
  <label>Up / down
    <input type="range" id="posy" min="20" max="70" value="45">
  </label>
</div>

<div class="note" id="note">
  Your uploaded image is placed on the center back exactly as your file
  looks &ndash; no edits or sketches. We&rsquo;ll send a proof before
  production.
</div>

<script>
(function () {
  // The jacket-back photo. Host it next to this file on GitHub Pages.
  var JACKET_BACK_URL = "jacket_back.jpg";

  // Where the image sits on the back, as fractions of the jacket photo.
  // The size/up-down sliders adjust within this.
  var CENTER_X = 0.50;     // middle of the back

  var jacket = document.getElementById("jacket");
  var canvas = document.getElementById("canvas");
  var ctx = canvas.getContext("2d");
  var fileInput = document.getElementById("file");
  var controls = document.getElementById("controls");
  var sizeEl = document.getElementById("size");
  var posyEl = document.getElementById("posy");
  var note = document.getElementById("note");

  var userImg = null;

  jacket.src = JACKET_BACK_URL;

  // Match the canvas to the displayed jacket size.
  function sizeCanvas() {
    canvas.width = jacket.clientWidth;
    canvas.height = jacket.clientHeight;
    canvas.style.width = jacket.clientWidth + "px";
    canvas.style.height = jacket.clientHeight + "px";
  }

  function draw() {
    sizeCanvas();
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if (!userImg) return;

    var W = canvas.width, H = canvas.height;

    // Image width as a fraction of the jacket, from the size slider.
    var frac = (parseInt(sizeEl.value, 10) || 62) / 100;
    var drawW = W * frac * 0.5;                 // 0.5: keep within the back
    var drawH = drawW * (userImg.height / userImg.width);

    var cx = W * CENTER_X;
    var cy = H * ((parseInt(posyEl.value, 10) || 45) / 100);

    ctx.drawImage(userImg, cx - drawW / 2, cy - drawH / 2, drawW, drawH);
  }

  fileInput.addEventListener("change", function () {
    var f = fileInput.files && fileInput.files[0];
    if (!f) return;

    if (!/^image\//.test(f.type)) {
      note.innerHTML =
        "<span class='warn'>That file is not an image. " +
        "Please pick a PNG or JPG.</span>";
      return;
    }

    var reader = new FileReader();
    reader.onload = function (e) {
      var img = new Image();
      img.onload = function () {
        userImg = img;
        controls.style.display = "block";
        note.innerHTML =
          "Preview only &ndash; the real placement is set by our team " +
          "and we&rsquo;ll send a proof before production.";
        draw();
      };
      img.onerror = function () {
        note.innerHTML =
          "<span class='warn'>Could not read that image. " +
          "Try a different file.</span>";
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(f);
  });

  sizeEl.addEventListener("input", draw);
  posyEl.addEventListener("input", draw);
  window.addEventListener("resize", draw);

  if (jacket.complete) draw();
  else jacket.addEventListener("load", draw);
  jacket.addEventListener("error", function () {
    note.innerHTML =
      "<span class='warn'>The jacket image didn't load. " +
      "Check JACKET_BACK_URL.</span>";
  });
})();
</script>
</body></html>
